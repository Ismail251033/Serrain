<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serene — Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-logo">
        <div class="splash-icon">
          <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13 20.5L17.5 25L27 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="splash-name">Serene</span>
      </div>
      <div class="splash-loader">
        <div class="splash-bar"></div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- App Shell -->
  <div id="app" class="app hidden">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="20" cy="20" r="18" stroke="currentColor" stroke-width="1.5"/>
              <path d="M13 20.5L17.5 25L27 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="logo-name">Serene</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-view="all" aria-label="All Tasks">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.4"/></svg>
          </span>
          <span class="nav-label">All Tasks</span>
          <span class="nav-count" id="countAll">0</span>
        </button>
        <button class="nav-item" data-view="today" aria-label="Today">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.4"/><path d="M7 2v4M13 2v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg>
          </span>
          <span class="nav-label">Today</span>
          <span class="nav-count" id="countToday">0</span>
        </button>
        <button class="nav-item" data-view="important" aria-label="Important">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none"><path d="M10 3l1.8 5.5H17l-4.4 3.2 1.7 5.3L10 14l-4.3 3 1.7-5.3L3 8.5h5.2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">Important</span>
          <span class="nav-count" id="countImportant">0</span>
        </button>
        <button class="nav-item" data-view="completed" aria-label="Completed">
          <span class="nav-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.4"/><path d="M7 10.5l2 2 4-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span class="nav-label">Completed</span>
          <span class="nav-count" id="countCompleted">0</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <span class="theme-icon theme-icon-light">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="1.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <span class="theme-icon theme-icon-dark">
            <svg viewBox="0 0 20 20" fill="none"><path d="M17 10.5A7 7 0 118.5 3 5.5 5.5 0 0017 10.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          </span>
          <span class="theme-label" id="themeLabel">Light Mode</span>
        </button>
      </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main Content -->
    <main class="main">

      <!-- Topbar -->
      <header class="topbar">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-date" id="topbarDate"></div>
        <div class="search-wrap">
          <span class="search-icon">
            <svg viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.4"/><path d="M15 15l-2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search tasks…" aria-label="Search tasks" />
          <button class="search-clear hidden" id="searchClear" aria-label="Clear search">
            <svg viewBox="0 0 20 20" fill="none"><path d="M6 6l8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>

      <!-- View Container -->
      <div class="view-container">
        <div class="view-header">
          <h1 class="view-title" id="viewTitle">All Tasks</h1>
          <p class="view-subtitle" id="viewSubtitle"></p>
        </div>

        <!-- Add Task Form -->
        <div class="add-task-wrap" id="addTaskWrap">
          <div class="add-task-form" id="addTaskForm">
            <input type="text" class="add-task-input" id="addTaskInput" placeholder="What needs to be done?" maxlength="200" aria-label="New task title" />
            <div class="add-task-meta">
              <textarea class="add-task-desc" id="addTaskDesc" placeholder="Add a note… (optional)" rows="2" maxlength="500" aria-label="Task description"></textarea>
              <div class="add-task-options">
                <div class="priority-selector" id="prioritySelector">
                  <button class="priority-btn active" data-priority="low" aria-label="Low priority">
                    <span class="priority-dot priority-low"></span> Low
                  </button>
                  <button class="priority-btn" data-priority="medium" aria-label="Medium priority">
                    <span class="priority-dot priority-medium"></span> Medium
                  </button>
                  <button class="priority-btn" data-priority="high" aria-label="High priority">
                    <span class="priority-dot priority-high"></span> High
                  </button>
                </div>
                <div class="add-task-actions">
                  <button class="btn-cancel" id="cancelAddTask" aria-label="Cancel">Cancel</button>
                  <button class="btn-add" id="confirmAddTask" aria-label="Add task">Add Task</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Task List -->
        <ul class="task-list" id="taskList" role="list" aria-label="Tasks">
        </ul>

        <!-- Empty State -->
        <div class="empty-state hidden" id="emptyState">
          <div class="empty-illustration">
            <div class="empty-circle empty-circle-1"></div>
            <div class="empty-circle empty-circle-2"></div>
            <div class="empty-check">
              <svg viewBox="0 0 48 48" fill="none"><path d="M14 24.5L20.5 31L34 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
          </div>
          <h2 class="empty-title" id="emptyTitle">Nothing here yet</h2>
          <p class="empty-text" id="emptyText">Enjoy the quiet.</p>
        </div>
      </div>

      <!-- Floating Add Button -->
      <button class="fab" id="fab" aria-label="Add new task">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </main>
  </div>

  <!-- Edit Task Modal -->
  <div class="modal-backdrop hidden" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="Edit task">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 class="modal-title">Edit Task</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">
          <svg viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="text" class="modal-input" id="editTaskTitle" placeholder="Task title" maxlength="200" aria-label="Task title" />
        <textarea class="modal-textarea" id="editTaskDesc" placeholder="Add a note… (optional)" rows="3" maxlength="500" aria-label="Task description"></textarea>
        <div class="modal-priority">
          <span class="modal-priority-label">Priority</span>
          <div class="priority-selector" id="editPrioritySelector">
            <button class="priority-btn active" data-priority="low">
              <span class="priority-dot priority-low"></span> Low
            </button>
            <button class="priority-btn" data-priority="medium">
              <span class="priority-dot priority-medium"></span> Medium
            </button>
            <button class="priority-btn" data-priority="high">
              <span class="priority-dot priority-high"></span> High
            </button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modalCancel">Cancel</button>
        <button class="btn-add" id="modalSave">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
